name: Firefly III
version: "0.1.0"
slug: firefly_iii
description: >-
  Open source personal finance manager: budgeting, bills, recurring
  transactions and multi-currency accounts. This add-on bundles Firefly III
  and a MariaDB database in one container. On first start the database schema
  is created automatically; open the web UI and register the first user (it
  becomes the site owner).
url: "https://github.com/firefly-iii/firefly-iii"
arch:
  - aarch64
  - amd64
init: false
boot: auto
startup: application
ports:
  8080/tcp: 8098
ports_description:
  8080/tcp: Firefly III web interface (HTTP). Access it at http://[HOST]:8098
webui: http://[HOST]:[PORT:8080]
watchdog: http://[HOST]:8098/login
options:
  app_url: ""
  site_owner: ""
  database_password: ""
  timezone: "Europe/Moscow"
  language: "ru_RU"
  locale: "ru_RU"
schema:
  app_url: "str?"
  site_owner: "str?"
  database_password: "password?"
  timezone: "str"
  language: "str"
  locale: "str"
image: "ghcr.io/luhzzi/firefly-iii-addon"